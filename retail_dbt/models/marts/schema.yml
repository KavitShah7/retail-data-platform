version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: email
        data_tests:
          - not_null

  - name: fact_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - pending
                  - shipped
                  - delivered
                  - cancelled

      - name: order_total
        data_tests:
          - not_null
