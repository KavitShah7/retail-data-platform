# Copy to a private profiles.yml directory, then set the environment variables.
# Never paste a key or passphrase into this file.
retail_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'RETAIL_DBT_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'RETAIL_DBT_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'RETAIL_WH') }}"
      database: RETAIL_DB
      schema: ANALYTICS
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_KEY_PASSPHRASE') }}"
      threads: 1
