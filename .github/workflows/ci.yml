name: Retail Data Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q python dags scripts tests
      - name: Lint Python (rules in pyproject.toml)
        run: ruff check python dags scripts tests
      - name: Run offline Python tests
        run: python -m pytest -v

  spark-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Spark and test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Run Spark transform and generator tests on local Spark
        run: python -m pytest -v tests/test_spark_transforms.py tests/test_generators.py

  airflow-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: /tmp/retail-airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Airflow and test dependencies
        run: python -m pip install -r requirements-airflow.txt -r requirements-dev.txt
      - name: Import all DAGs without executing tasks
        run: python scripts/check_dags.py
      - name: Check DAG graph and mocked task safety
        run: python -m pytest -v

  dbt-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dbt Snowflake adapter
        run: python -m pip install -r requirements-dbt.txt
      - name: Parse dbt with offline credentials (no warehouse connection)
        run: >-
          dbt parse --project-dir retail_dbt
          --profiles-dir tests/fixtures/dbt --no-partial-parse

  terraform-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
      - name: Check Terraform formatting
        run: terraform fmt -check
      - name: Initialize Terraform without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform
        run: terraform validate

  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build customer generator image
        run: docker build -t retail-customer-generator .
      - name: Smoke test customer generator in a fresh container
        run: docker run --rm --network none retail-customer-generator
      - name: Build Kafka producer image
        run: docker build -f Dockerfile.kafka -t retail-kafka-producer .
