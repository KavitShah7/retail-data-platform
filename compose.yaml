services:
  customer-generator:
    build: .
    image: retail-customer-generator
    environment:
      RETAIL_SEED: ${RETAIL_SEED:-}
    volumes:
      - ./docker-output:/app/data

  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    image: retail-kafka-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9094}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-retail_orders}
      KAFKA_NUM_EVENTS: ${KAFKA_NUM_EVENTS:-10}
    # Linux hosts need this for host.docker.internal; Docker Desktop has it built in.
    extra_hosts:
      - "host.docker.internal:host-gateway"
